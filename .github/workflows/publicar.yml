# Gera a página a partir do Zotero e publica no GitHub Pages (portfolio.antcbrasil.org.br).
# Em Settings > Pages, a origem ("Source") deve ser "GitHub Actions".
name: Publicar portfólio

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Renova a cópia embutida todo dia às 6h de Brasília (9h UTC)
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # O script tenta de novo se a API do Zotero falhar; se ainda assim não conseguir os itens,
      # o job para aqui e a versão no ar continua a anterior
      - run: mkdir _site && python3 gerar_pagina.py _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      # Nova tentativa: às vezes o GitHub não encontra o artefato recém-enviado ("No artifacts named
      # github-pages"). Espera um minuto, reenvia com outro nome e publica de novo; se falhar outra
      # vez, o job falha e a versão no ar continua a anterior.
      - if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - if: steps.deploy.outcome == 'failure'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          name: github-pages-2
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-2
