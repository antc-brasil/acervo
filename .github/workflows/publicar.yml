# Gera a página a partir do Zotero e publica no GitHub Pages (acervo.antcbrasil.org.br).
# Em Settings > Pages, a origem ("Source") deve ser "GitHub Actions".
name: Publicar acervo

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Renova a cópia embutida todo dia às 6h de Brasília (9h UTC)
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # O script tenta de novo se a API do Zotero falhar; se ainda assim não conseguir os itens,
      # o job para aqui e a versão no ar continua a anterior
      - run: mkdir _site && python3 gerar_pagina.py _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
